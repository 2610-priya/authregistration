
server.port=8080

# Database Configuration
# Uses default localhost values if environment variables are not set
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:login_system}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# A secure 256-bit HMAC-SHA key is required for JWT. 
# Local development uses a default fallback key. Production should override it via the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:9a4f2c8d3e1b7f0a5c8d6e3f2b1a7d6e8f0a3c2b1d7e8f5a6b0c2d3e4f5a6b7c8d9e0f}
# Token validity duration: 24 hours (86,400,000 milliseconds)
jwt.expiration=86400000
